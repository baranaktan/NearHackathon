[package]
name = "perde"
description = "Perde: stealth-address announcement registry for private payments on NEAR"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.2"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
